services:
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j_movielens
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt (cypher-shell / драйвери)
    environment:
      NEO4J_AUTH: "neo4j/password123"
      # NEO4J_PLUGINS авто-завантажує APOC та GDS, сумісні з 5.18 (GDS 2.6.x)
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      # У Neo4j 5.x налаштування памʼяті живуть у namespace server.* (а не застарілому dbms.memory.*).
      # 4g heap — для важких jоin-ів матеріалізації графів у Частині 5.
      NEO4J_server_memory_heap_initial__size: "2g"
      NEO4J_server_memory_heap_max__size: "4g"
      NEO4J_server_memory_pagecache_size: "1g"
      # Дозволи на виклик процедур APOC/GDS (у 5.x лишаються в namespace dbms.security.*)
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      # Папку import монтуємо у два можливі шляхи import-каталогу контейнера —
      # 'file:///...' у LOAD CSV резолвиться відносно server.directories.import.
      - ./import:/var/lib/neo4j/import
      - ./import:/import
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
